{% extends "index.html" %}

{% block title %}로그인 | 깃든 마켓{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
{% endblock %}

{% block content %}
<section class="auth-card" aria-labelledby="auth-title">
    <h1 id="auth-title">로그인</h1>
    <p class="auth-description">깃든 마켓 계정으로 로그인하세요.</p>

    {% if error %}
    <p class="auth-error" role="alert">{{ error }}</p>
    {% endif %}

    <form class="auth-form" method="post" action="{{ url_for('auth.login') }}">
        <div class="form-field">
            <label for="login-id">아이디</label>
            <input id="login-id" name="id" type="text" autocomplete="username" required>
        </div>
        <div class="form-field">
            <label for="login-pw">비밀번호</label>
            <input id="login-pw" name="pw" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">로그인</button>
    </form>

    <p class="auth-switch">아직 계정이 없으신가요? <a href="{{ url_for('auth.signup') }}">회원가입</a></p>
</section>
{% endblock %}
