{% extends "index.html" %} {% block title %}상품 등록 | 깃든 마켓{% endblock %}
{% block content %}
<h1>상품 등록</h1>
<p>판매할 상품의 정보와 사진을 입력하는 화면입니다.</p>

<form
  action="{{ url_for('product_result.result') }}"
  method="post"
  enctype="multipart/form-data"
>
  <div class="field">
    <label for="product_name">Product name</label>
    <input type="text" id="product_name" name="product_name" required />
  </div>

  <div class="field">
    <label for="seller_id">Seller ID</label>
    <input type="text" id="seller_id" name="seller_id" required />
  </div>

  <div class="field">
    <label for="price">Price</label>
    <input type="number" id="price" name="price" min="0" required />
  </div>

  <div class="field">
    <label for="address">Address</label>
    <input type="text" id="address" name="address" required />
  </div>

  <div class="field">
    <label for="status">Status</label>
    <select id="status" name="status" required>
      <option value="새 상품">새 상품</option>
      <option value="거의 새 상품">거의 새 상품</option>
      <option value="사용감 있음">사용감 있음</option>
    </select>
  </div>

  <div class="field">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required />
  </div>

  <div class="field">
    <label for="picture">Representative Image upload</label>
    <input
      type="file"
      id="picture"
      name="picture"
      accept=".png,.jpg,.jpeg,.webp"
      required
    />
  </div>

  <button type="submit">Submit</button>
</form>
{% endblock %}
