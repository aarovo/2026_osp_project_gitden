{% extends "index.html" %}
{% block title %}등록 결과 | 깃든 마켓{% endblock %}
{% block content %}
<h1>등록 결과</h1>
{% if data %}
<p>
  상품이름 : {{product_name}}
  판매자 ID : {{seller_id}}
  가격 : {{price}}
  주소 : {{address}}
  상태 : {{status}}
  이메일 : {{email}}
</p>
<image src="{{static/image/}}" alt="상품 이미지" />
{% else %}
    <p>상품 등록 처리가 아직 준비되지 않았습니다.</p>
{% endif %}
{% endblock %}
