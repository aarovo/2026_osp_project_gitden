{% extends "index.html" %} {% block title %}리뷰 등록 | 깃든 마켓{% endblock %}
{% block content %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='register_review.css') }}"
/>

<h1>리뷰 등록</h1>
<p class="review-intro">구매한 상품의 사진과 사용 후기를 남겨 주세요.</p>

<form
  class="review-form"
  action="{{ url_for('reviews.reg_review_submit_post') }}"
  method="post"
  enctype="multipart/form-data"
>
  <div class="field">
    <label for="product-name">상품</label>
    <input
      id="product-name"
      type="text"
      name="product_name"
      value="{{ name }}"
      {%
      if
      name
      %}readonly{%
      endif
      %}
      required
    />
  </div>

  <div class="field">
    <label for="review-title">제목</label>
    <input
      id="review-title"
      type="text"
      name="title"
      placeholder="한 줄로 요약해 주세요"
      required
    />
  </div>

  <div class="field field-top">
    <label for="review-body">리뷰</label>
    <textarea
      id="review-body"
      name="body"
      rows="6"
      placeholder="사용해 본 느낌을 자유롭게 적어 주세요"
      required
    ></textarea>
  </div>

  <div class="field">
    <span class="field-label">평점</span>
    <div class="rating">
      <input type="radio" id="star5" name="rating" value="5" required /><label
        for="star5"
        title="5점"
        >★</label
      >
      <input type="radio" id="star4" name="rating" value="4" /><label
        for="star4"
        title="4점"
        >★</label
      >
      <input type="radio" id="star3" name="rating" value="3" /><label
        for="star3"
        title="3점"
        >★</label
      >
      <input type="radio" id="star2" name="rating" value="2" /><label
        for="star2"
        title="2점"
        >★</label
      >
      <input type="radio" id="star1" name="rating" value="1" /><label
        for="star1"
        title="1점"
        >★</label
      >
    </div>
  </div>

  <div class="field">
    <label for="review-photo">사진</label>
    <input
      id="review-photo"
      type="file"
      name="photo"
      accept="image/png,image/jpeg,image/webp"
      required
    />
  </div>

  <div class="form-actions">
    <button type="submit">리뷰 등록</button>
  </div>
</form>
{% endblock %}
